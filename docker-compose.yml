services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: gameswarp
      POSTGRES_PASSWORD: gameswarp
      POSTGRES_DB: gameswarp
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gameswarp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
