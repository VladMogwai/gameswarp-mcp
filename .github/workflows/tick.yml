name: tick

on:
  schedule:
    # Hourly. The tightest feed - Polygon - holds about five hours of articles,
    # so anything slower than that loses items permanently. GitHub delays
    # scheduled runs under load, which the five-hour margin absorbs.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/tick.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Explaining rating falls needs a model, and a scheduled job cannot reach
      # the one on a laptop. Skipped rather than failed when no key is set, so
      # collection keeps working on its own.
      - name: explain rating drops
        if: ${{ env.MODEL_API_KEY != '' }}
        run: node scripts/analyse-drops.mjs 4
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_PROVIDER: openai-compatible
          MODEL_NAME: openai/gpt-oss-20b
          MODEL_BASE_URL: https://api.groq.com/openai/v1
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
