name: tick

on:
  schedule:
    # Hourly. The tightest feed - Polygon - holds about five hours of articles,
    # so anything slower than that loses items permanently. GitHub delays
    # scheduled runs under load, which the five-hour margin absorbs.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/tick.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
